# Example only. Real credentials belong in the ignored .streamlit/secrets.toml
# or in Streamlit Community Cloud's Secrets editor.
[auth]
redirect_uri = "https://REPLACE_APP_NAME.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_GOOGLE_OAUTH_CLIENT_ID"
client_secret = "REPLACE_GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[firestore]
project_id = "REPLACE_FIREBASE_PROJECT_ID"
database_id = "(default)"

[firestore.service_account]
type = "service_account"
project_id = "REPLACE_FIREBASE_PROJECT_ID"
private_key_id = "REPLACE_PRIVATE_KEY_ID"
private_key = "REPLACE_PRIVATE_KEY_PEM"
client_email = "REPLACE_SERVICE_ACCOUNT_EMAIL"
client_id = "REPLACE_SERVICE_ACCOUNT_ID"
token_uri = "https://oauth2.googleapis.com/token"
